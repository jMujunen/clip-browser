<!DOCTYPE html>
<html>
  <head>
    <title>Camera Clips</title>
    <style>
      body {
        font-family: sans-serif;
        background: #f9f9f9;
      }
      .clip {
        margin: 20px;
        display: inline-block;
        vertical-align: top;
      }
      video,
      img {
        width: 320px;
        height: auto;
        border-radius: 8px;
      }
      #loading {
        text-align: center;
        margin: 20px;
        font-size: 14px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h2>Clips from Today</h2>
    <div id="clips"></div>
    <div id="loading">Loading...</div>

    <script>
      let page = 1;
      const limit = 5; // clips per batch
      let loading = false;

      async function loadClips() {
        if (loading) return;
        loading = true;
        const res = await fetch(`/api/clips?page=${page}&limit=${limit}`);
        const data = await res.json();

        const container = document.getElementById("clips");
        data.clips.forEach((clip) => {
          const div = document.createElement("div");
          div.className = "clip";
          div.innerHTML = `
                    <video controls preload="none" poster="/thumb/${clip.replace(".mp4", ".jpg")}">
                        <source src="/video/${clip}" type="video/mp4">
                    </video>
                    <p>${clip}</p>`;
          container.appendChild(div);
        });

        if (data.has_more) {
          page++;
          observer.observe(document.querySelector("#loading"));
        } else {
          document.getElementById("loading").innerText = "No more clips";
        }
        loading = false;
      }

      // IntersectionObserver to detect when #loading comes into view
      const observer = new IntersectionObserver(
        (entries) => {
          if (entries[0].isIntersecting) {
            observer.unobserve(entries[0].target);
            loadClips();
          }
        },
        { rootMargin: "100px" }
      );

      // Start initial load
      loadClips();
    </script>
  </body>
</html>
