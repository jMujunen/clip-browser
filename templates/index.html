<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera Clips</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h2 class="mb-4 text-center">Camera Motion Clips</h2>
      {% if clips %}
      <div class="row">
        {% for clip in clips %}
        <div class="col-12 mb-4">
          <div class="card shadow-sm">
            <div class="card-body">

              <a href="{{ url_for('download_clip', filename=clip) }}"
                class="card-title"
                >{{ clip }}</a><sub> (download) </sub>

              </h6>
                <a
                href="{{ url_for('get_clip', filename=clip) }}"
                target="_blank"
                rel="noopener noreferrer"
                class="d-block text-center"
                >
                <video controls preload="none" poster="/thumb/{{ clip[:-4] }}.jpg" class="w-100 mb-2">
                    <source src="{{ url_for('get_clip', filename=clip) }}" type="video/mp4" />
                    Your browser does not support the video tag.
                </video>
                </a>

            </div>
          </div>
        </div>
        {% endfor %}
      </div>
      {% else %}
      <p class="text-center">No clips found.</p>
      {% endif %}
    </div>
  </body>
</html>
